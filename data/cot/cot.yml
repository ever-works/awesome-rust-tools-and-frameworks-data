name: Cot
description: Cot is a cutting-edge web framework for building high-performance,
  async-first APIs in Rust. Built on top of Tokio and Hyper, Cot prioritizes
  modularity and speed over batteries-included features. It's ideal for
  developers who want maximum control over their request pipeline and are
  comfortable assembling tools a la carte.
source_url: https://github.com/cot-rs/cot
category: Web Frameworks
tags:
