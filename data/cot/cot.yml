markdown: >-
  ## Overview


  Cot is a cutting-edge web framework for building high-performance, async-first
  APIs in Rust. It is built on top of Tokio and Hyper and emphasizes modularity
  and speed, without prescribing ORM, templating, or a built-in database layer.
