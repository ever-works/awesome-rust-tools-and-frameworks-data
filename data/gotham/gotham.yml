markdown: >-
  ## Overview


  Gotham is a flexible web framework built for stable Rust, emphasizing
  stability, safety, security, and speed. It provides asynchronous support via
  Tokio and Hyper, with routing, extractors, middleware, state sharing, and
  testing. It does not include built-in structure, boilerplate, or database
  support by default.
