featured: false
markdown: >
  ## Overview


  Sycamore is a Rust web framework for building frontend apps that compile to
  WebAssembly.


  ## Examples


  Code examples show a component App with reactive signals and a view using the
  view! macro and JSX-like syntax.


  ## Notes


  Sycamore provides a bind: modifier for attributes and uses signals for
  reactive state.
