markdown: >-
  ## Overview

  Vizia is a Rust GUI library described as a declarative UI framework with a
  Lens-based state model.


  ## Example

  AppData { label: String } and AppEvent::SetText(String) drive the example
  where a Label and a Textbox reflect and update state.


  ## Notes

  The project emphasizes using the Git repository for the latest changes.
