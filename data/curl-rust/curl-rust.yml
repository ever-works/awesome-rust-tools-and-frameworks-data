markdown: >
  ## Overview

  curl-rust provides libcurl bindings for Rust, exposing libcurl functionality
  to Rust code. It does not offer asynchronous requests, which can be a
  limitation for high-concurrency scenarios. It includes support for additional
  transfer protocols like Telnet, SMTP, FTP, IMAP, and LDAP. It is best used
  when you need curl integration or have an existing stack that already depends
  on curl.


  ## Usage

  The article includes a POST example showing how to construct a request using
  curl-rust. For example:

  ```

  use std::io::Read;

  use curl::easy::Easy;


  fn main() {
      let mut data = "this is the body".as_bytes();

      let mut easy = Easy::new();
      easy.url("http://www.example.com/upload").unwrap();
      easy.post(true).unwrap();
      easy.post_field_size(data.len() as u64).unwrap();

      let mut transfer = easy.transfer();
      transfer.read_function(|buf| { Ok(data.read(buf).unwrap_or(0)) }).unwrap();
      transfer.perform().unwrap();
  }

  ```
