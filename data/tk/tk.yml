markdown: >-
  ## Overview

  Tk is the classic Tcl GUI toolkit with Rust bindings.

  \n## Notes

  The Rust bindings demonstrate how to work around language keyword constraints
  using r#type in attribute bindings. It shows two-way state patterns using
  Label and Entry widgets.
