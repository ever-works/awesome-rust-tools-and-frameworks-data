markdown: >+
  ## Overview


  Fyrox is a production-ready Rust game engine with an emphasis on tooling and a
  built-in scene editor. The engine runs on Windows, Linux, macOS, and
  WebAssembly.


  ## Features


  - 2D and 3D rendering support

  - Scene editor with real-time preview

  - Rapid iterative compilation to shorten edit-compile cycles

