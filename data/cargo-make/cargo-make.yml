name: cargo-make
description: Cargo-make is a Rust-based task runner and automation tool that
  executes Makefile.toml-defined tasks. It supports extending and overriding
  tasks from external Makefiles, automatic workspace-level makefile extension,
  and load_script-based fetching of common TOML files. It provides per-task and
  per-platform overrides, and comprehensive environment variable handling via
  env blocks, env_files, and env_scripts.
