name: Rocket
description: Rocket is a web framework for Rust that makes it simple to write
  fast, secure web applications without sacrificing flexibility, usability, or
  type safety. Rocket uses Rust's type system to guarantee correctness at
  compile time, eliminating entire classes of runtime errors. It features an
  intuitive request handling API, built-in templating, cookie handling, and form
  validation. Rocket emphasizes developer experience with excellent
  documentation and helpful error messages. Version 0.5 added full async/await
  support, making it competitive with other modern Rust frameworks.
source_url: https://rocket.rs/
