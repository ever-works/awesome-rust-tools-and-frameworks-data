name: Actix Web
description: Actix Web is a popular Rust backend framework known for its
  type-safety, performance, and feature-rich ecosystem. It supports HTTP/2,
  logging, and a broad set of middleware and extensions, and can be extended
  with many crates for additional capabilities.
