markdown: >-
  ## Overview


  Actix Web emphasizes type safety and high performance, with built-in HTTP/2
  support, logging, and a rich middleware ecosystem.


  ## Features


  - Type-safe request handling

  - HTTP/2 and advanced routing

  - Broad feature set with extensible crates

  - Strong community support


