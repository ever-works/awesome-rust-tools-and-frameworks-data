name: Actix Web
description: Actix Web is a powerful, pragmatic, and extremely fast web
  framework for Rust built on top of the Actix actor framework. It provides a
  rich set of features including routing, middleware, request handlers, and
  WebSocket support. Actix Web consistently ranks among the fastest web
  frameworks in benchmarks, handling hundreds of thousands of requests per
  second. It offers a flexible middleware system, strong type safety, and
  supports both sync and async handlers. The framework is production-ready and
  used by companies running high-traffic services.
source_url: https://actix.rs/
category: Web Frameworks
tags:
