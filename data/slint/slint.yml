name: Slint
description: Slint (formerly SixtyFPS) is a Rust GUI DSL with its own engine and
  two-way data binding. It ships with C++, JavaScript, and Python bindings and
  aims to provide native UI with a separate DSL rather than Rust macros. The
  project emphasizes accessibility improvements and cross-language bindings.
source_url: https://slint-ui.org/
