featured: false
markdown: >
  ## Overview


  Slint is a GUI DSL with its own language and supports data binding via a
  two-way binding operator (<=>). It provides bindings for C++, JS, and Python,
  and can be used from Rust without relying on macros.


  ## Accessibility


  The project has seen improvements in accessibility and IME support, and the
  DSL language has its own compilation errors and messaging.
