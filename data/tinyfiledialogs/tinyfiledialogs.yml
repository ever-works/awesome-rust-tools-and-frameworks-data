  ## Overview

  A small C library with Rust bindings that exposes prompts and file dialogs
  (message boxes, text input, file dialogs).


  ## Features

  - Basic prompt dialogs and file selection dialogs

  - Cross-platform compatibility


  ## Notes

  Useful for quick user input without pulling in a full GUI toolkit.
