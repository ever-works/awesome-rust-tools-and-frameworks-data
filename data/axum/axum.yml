name: Axum
description: Axum is a highly ergonomic and modular web framework for Rust built
  by the Tokio team. It leverages Tower for middleware and Hyper for HTTP
  handling, providing excellent async support. Axum focuses on type safety with
  its extractor system that uses Rust's type system to automatically parse and
  validate request data. It supports WebSockets, state management, and
  integrates seamlessly with the Tokio ecosystem. Unlike other frameworks, Axum
  doesn't impose a specific runtime, making it flexible for various deployment
  scenarios.
