markdown: >-
  ## Overview


  Poem is a Rust web framework built on Hyper and Tokio, designed for high
  performance and simplicity.


  ## Features


  - OpenAPI support for API documentation

  - Middleware system for custom logic

  - Async support via Tokio

  - Type safety

  - Easy-to-use API


