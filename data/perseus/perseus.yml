name: Perseus
description: Perseus is a Rust framework for building reactive web applications
  with server-side rendering (SSR) and static site generation (SSG). It
  leverages the Sycamore reactive library and provides an experience comparable
  to Next.js for the Rust ecosystem, with a growing community.
