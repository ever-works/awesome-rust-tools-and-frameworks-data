name: WebRender
description: WebRender is a low-level graphics crate originally part of Servo,
  focused on rendering shapes for high-performance UIs and browsers. It is not a
  high-level GUI toolkit, but provides the rendering substrate used by more
  complete UI systems.
source_url: https://github.com/servo/webrender
category: GUI
