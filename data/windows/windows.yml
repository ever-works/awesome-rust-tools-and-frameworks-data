markdown: >-
  ## Overview

  Windows APIs have Rust bindings via the windows-rs project. This entry
  clarifies scope issues for XAML/WinUI 3 and differences from other bindings.


  ## Notes

  This is not a GUI toolkit per se, but a platform binding used by GUI apps on
  Windows.
