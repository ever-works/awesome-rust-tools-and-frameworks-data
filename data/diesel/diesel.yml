name: Diesel
description: Diesel is a safe, extensible ORM and query builder for Rust. It
  eliminates the possibility of runtime errors in your database interactions by
  checking queries at compile time against your database schema. Diesel provides
  a type-safe DSL for constructing SQL queries, migrations support, and
  associations between tables. It's designed for performance with zero-cost
  abstractions and supports PostgreSQL, MySQL, and SQLite. Diesel is ideal for
  applications requiring compile-time query validation and predictable
  performance characteristics.
