markdown: >+
  ## Overview


  Proptest is a property-based testing framework for Rust, inspired by
  Hypothesis. It generates random inputs to test properties of your code and
  automatically shrinks failing inputs to the minimal counterexample.


  ## Features


  - Property-based testing over a wide input space

  - Automatic shrinking of failing inputs

  - Integrates with cargo test


  ## Example


  ```rust

  use proptest::prelude::*;


  proptest! {
    #[test]
    fn test_example(y in 0u32..10000, m in 1u32..13, d in 1u32..32) {
      // placeholder for actual test logic
      let _ = (y, m, d);
    }
  }

  ```

