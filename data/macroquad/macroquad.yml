  ## Overview


  Macroquad is a cross‑platform Rust library for building games with an emphasis
  on simplicity and portability.


  ## Platforms


  - Windows/Linux/macOS

  - HTML5 browsers

  - Android

  - iOS


  ## Example


  ```rust

  use macroquad::prelude::*;

  ```
