name: Rustify
description: Rustify is a lightweight and flexible library for building HTTP
  clients in Rust. It aims to simplify scaffolding HTTP APIs with support for
  both asynchronous and synchronous clients, custom client implementations, and
  middleware.
source_url: https://crates.io/crates/rustify
category: Async & Networking
tags:
  - open-source
  - http
  - middleware
markdown: >-
  ## Overview

  Rustify enables building HTTP clients with features such as a pluggable Client
  trait, endpoints, and optional middleware, with support for serializing
  requests and deserializing responses.
