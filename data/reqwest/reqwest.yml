name: reqwest
description: Reqwest is a high-level HTTP client built on top of hyper. It
  provides an ergonomic API with both asynchronous and blocking clients,
  supports proxies, cookies, and customizable redirect policies, and can handle
  plain bodies, JSON, URL-encoded, and multipart data.
source_url: https://docs.rs/reqwest
category: Async & Networking
tags:
  - open-source
  - async
  - http
markdown: >-
  ## Overview

  Reqwest offers an HTTP client built on hyper, with an async and blocking
  client. It supports proxies, cookies, and a range of body types (plain, JSON,
  urlencoded, multipart) and custom redirect policies.
