markdown: >-
  ## Overview


  Sauron is a micro frontend framework inspired by Elm Architecture. It supports
  events, state management, and client-side and server-side rendering.


  ## Getting started


  - Explore examples and tutorials on the Sauron repository and community
  resources.


  ## Features


  - Event-driven state management

  - Client-side and server-side rendering

  - Growing community and ecosystem
