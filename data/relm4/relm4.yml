markdown: >
  ## Overview


  Relm4 provides a GTK 4-based architecture for building GUI apps in Rust using
  a higher-level abstraction over GTK widgets.


  ## Notes


  The project is in comparison to Relm and GTK 4 integration and may have
  varying levels of documentation and community activity.
