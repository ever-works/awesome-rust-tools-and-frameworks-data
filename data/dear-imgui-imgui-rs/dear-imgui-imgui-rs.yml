name: Dear ImGui (imgui-rs)
description: Dear ImGui is a minimalist C++ GUI library with Rust bindings; it
  is designed for integration with existing game engines and renders through
  multiple backends. The Rust ecosystem has bindings like imgui-rs and multiple
  renderers/backends such as imgui-glow-renderer and imgui-winit-support, with
  others being deprecated.
